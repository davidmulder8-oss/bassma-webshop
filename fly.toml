# Sjabloon voor Fly.io (zie ONLINE-ZETTEN.md). Pas "app" en PUBLIC_URL aan. Geheimen zet je NIET hier maar met: fly secrets set ...
app = "bassma-api"
primary_region = "ams"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  NODE_ENV = "production"
  PUBLIC_URL = "https://www.jouwdomein.nl"
  PAYMENT_PROVIDER = "sumup"

# Vaste schijf voor de database en de back-ups. Maak hem eerst aan: fly volumes create bassma_data --region ams --size 1
[[mounts]]
  source = "bassma_data"
  destination = "/data"

# SQLite werkt met precies één server. Niet opschalen naar meer machines.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
